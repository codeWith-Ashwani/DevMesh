name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test & AppSec Quality Gate
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      JWT_SECRET: CI_TEST_ONLY_SECRET
      CLIENT_URL: http://localhost:5173
      DB_CONNECTION_STRING: mongodb://127.0.0.1:27017/devmesh_test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Print Diagnostic Environment Info
        run: |
          echo "=== Node & npm Diagnostics ==="
          node --version
          npm --version
          echo "=============================="

      - name: Install Clean Dependencies
        run: npm ci

      - name: Run Automated Test Suite (with Coverage)
        run: npm test

      - name: Run Dedicated AppSec & Security Verification
        run: npm run test:security
